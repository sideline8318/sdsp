<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="product-version" content="5e483cfb37e722acecab8a5fb32b737939ab363e">
  <meta name="workflow-marker" content="2192abc0-3396-4d6a-a30c-e8911fe95564">
  <title>MonkeyCode 公网交付验证</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
      color: var(--fg);
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.9rem;
      line-height: 1.3;
      color: #fff;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
    }
    .version {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      padding: 12px 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .version .label { color: var(--muted); font-size: 0.9rem; }
    .version code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
      font-size: 0.92rem;
      word-break: break-all;
    }
    ul {
      list-style: none;
      margin: 0 0 28px;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--fg);
      font-size: 0.98rem;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
      flex: 0 0 auto;
    }
    footer {
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      padding-top: 16px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>MonkeyCode 公网可访问页面</h1>
    </header>
    <main>
      <p class="lead">
        本页面用于验证当前生产 MonkeyCode 能够从需求推进到可在公网直接打开的 URL。
        这是一个单页静态交付物，无需登录、无需数据库。
      </p>
      <div class="version">
        <span class="label">生产版本</span>
        <code>5e483cfb37e722acecab8a5fb32b737939ab363e</code>
      </div>
      <ul>
        <li><span class="dot"></span>单页静态页面</li>
        <li><span class="dot"></span>无需登录</li>
        <li><span class="dot"></span>无需数据库</li>
      </ul>
    </main>
    <footer>
      <div>Workflow: 2192abc0-3396-4d6a-a30c-e8911fe95564</div>
      <div>由 MonkeyCode Loop 开发阶段生成</div>
    </footer>
  </div>
</body>
</html>
